<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudVault - Cloud File Storage</title>
    <!-- Core Styles -->
    <link rel="stylesheet" href="src/style.css" />
    <link rel="stylesheet" href="src/mediaquery.css" />

    <!-- Media Queries (Not recommended to separate, but requested) -->
    <link rel="stylesheet" href="media.css" />
  </head>
  <body>
    <!-- LOGIN SCREEN -->
    <section id="loginScreen">
      <div class="login-box fade-in">
        <div class="logo">
          <div class="logo-icon">☁</div>
          CloudVault
        </div>
        <h1>Welcome back</h1>
        <p>Sign in to access your cloud storage.</p>

        <div id="loginError" class="login-error">Invalid username or password.</div>

        <form id="loginForm">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" required />
          </div>
          <button class="btn btn-primary" style="width: 100%">Sign In</button>
        </form>

        <div class="demo-login">
          <strong>Demo Login</strong><br />
          Username: <b>admin</b><br />
          Password: <b>admin123</b>
        </div>
      </div>
    </section>

    <!-- MAIN APPLICATION -->
    <div id="app">
      <div class="layout">
        <!-- SIDEBAR -->
        <aside class="sidebar slide-in-left" id="sidebar">
          <div class="logo">
            <div class="logo-icon">☁</div>
            CloudVault
          </div>

          <div class="nav-title">MAIN</div>
          <div class="nav-item active" data-page="dashboard">
            <span class="nav-icon">▦</span>Dashboard
          </div>
          <div class="nav-item" data-page="files"><span class="nav-icon">📁</span>My Files</div>
          <div class="nav-item" data-page="shared">
            <span class="nav-icon">🔗</span>Shared Files
          </div>
          <div class="nav-item" data-page="trash"><span class="nav-icon">🗑</span>Trash</div>

          <div class="nav-title">ACCOUNT</div>
          <div class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</div>
          <div class="nav-item" id="logoutBtn"><span class="nav-icon">↪</span>Logout</div>

          <div class="storage-box">
            <div class="storage-title">Storage</div>
            <div class="progress">
              <div id="storageProgress"></div>
            </div>
            <div class="storage-info" id="storageText">0 MB of 5 GB used</div>
          </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main">
          <header class="topbar fade-in">
            <button class="icon-btn mobile-menu" id="menuBtn">☰</button>
            <div class="search">
              <span class="search-icon">🔍</span>
              <input type="text" id="searchInput" placeholder="Search files..." />
            </div>
            <div class="top-actions">
              <button class="icon-btn" id="themeBtn" title="Toggle theme">☾</button>
              <div class="user">
                <div class="avatar" id="avatar">A</div>
                <span id="topUsername">Admin</span>
              </div>
            </div>
          </header>

          <!-- DYNAMIC CONTENT INJECTED HERE -->
          <div class="content fade-in" id="content"></div>
        </main>
      </div>
    </div>

    <!-- MODALS & OVERLAYS -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal pop-in" id="modal"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- HIDDEN FILE INPUT -->
    <input type="file" id="fileInput" multiple hidden />

    <!-- External Script -->
    <script src="script/script.js"></script>
  </body>
</html>
